  <rect width="640" height="520" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="80" cy="70" r="1.6" opacity="0.9"/><circle cx="160" cy="120" r="1.1" opacity="0.7"/>
    <circle cx="250" cy="60" r="1.4" opacity="0.8"/><circle cx="330" cy="140" r="1" opacity="0.6"/>
